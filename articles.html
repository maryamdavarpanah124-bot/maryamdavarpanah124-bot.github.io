<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مقالات - مریم داورپناه</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- فونت زیبا -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html {
      font-size: clamp(15px, 1vw + 0.5rem, 18px); /* واکنش‌گرا */
    }
    body {
      font-family: "Vazirmatn", sans-serif;
      background: #f7f9fc;
      margin: 0;
      color: #24324a;
    }

    /* هدر */
    .header-bar {
      width: 100%;
      height: 150px; /* کمی کوتاه‌تر */
      position: relative;
      overflow: hidden;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .header-bar img.bg-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.92);
    }

    /* تصویر مقالات */
    .header-profile {
      position: absolute;
      bottom: -20px;
      right: 20px;
      z-index: 10;
    }
    .header-profile img {
      width: 12rem;
      height: 12rem;
      border-radius: 50%;
      border: 0.25rem solid #fff;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    /* دکمه بازگشت */
    .back-btn {
      position: absolute;
      bottom: 0.6rem;
      left: 1.2rem;
      background: #4caf50;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,.2);
      z-index: 11;
      font-size: 0.95rem;
    }
    .back-btn:hover { background: #43a047; }

    /* نام و عنوان */
    .name-box {
      margin: 1rem 1.2rem 0;
    }
    .name-box h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #1f3fb8;
      margin: 0;
    }
    .name-box h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #334e7d;
      margin: 0.5rem 0 0;
    }

    /* بخش مقالات */
    .articles-section {
      width: 92%;
      margin: 0.5rem auto 2rem;
      background-image: url("img/math-pattern.png");
      background-repeat: repeat;
      background-size: 7rem;
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 1rem;
    }
    .article-card {
      background: #fff;
      padding: 0.8rem;
      border-radius: 0.8rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      text-align: center;
      min-height: 7.5rem; /* کوچکتر */
    }
    .article-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1.2rem;
      font-weight: 900;
      color: #1f3fb8;
    }
    .article-card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #333;
      margin: 0.4rem 0;
    }

      margin-top: 0.4rem;
      padding: 0.5rem 1rem;
      background: #aeea00;
      color: #24324a;
      border-radius: 0.6rem;
      text-decoration: none;
